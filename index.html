<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nhịp Ngày</title>
<meta name="description" content="Quản lý thu chi, thời gian, lịch sinh hoạt và ăn uống mỗi ngày.">
<meta name="theme-color" content="#0D1015">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nhịp Ngày">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* page reset */
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.sh-actions.two>.btn{flex:1}

/* Layout: one narrow phone column — sticky date header, the selected day's view, bottom tab bar with a raised "Ghi" button in the middle. Icon tiles carry category colour; trackers keep their own hue (lịch lavender, ăn uống apricot, tiền green). */
:root{
  color-scheme: dark;
  --bg:#0D1015;
  --surface:#151A21;
  --surface-2:#1D232C;
  --line:#272E39;
  --fg:#E9ECF1;
  --muted:#8C95A4;
  --faint:#5E6777;
  --ink:#0D1015;
  --scrim:rgba(4,6,9,.62);
  --shadow:none;
  --plan:#A79BFF;
  --food:#EFAD72;
  --money:#5CC9A5;
  --in:#5CC9A5;
  --over:#FF7D73;
  --h-apricot:#EFAD72;
  --h-sky:#7FA7F5;
  --h-lav:#B59CFF;
  --h-rose:#EE8FB2;
  --h-yellow:#E5CF76;
  --h-cyan:#5EC4D6;
  --h-tan:#CDA882;
  --h-lime:#A3D977;
  --h-green:#5CC9A5;
  --h-grey:#8C95A4;
  --font-ui:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px;
  --nav-h:64px;
}
:root[data-skin="light"]{
  color-scheme: light;
  --bg:#F4F3F7;
  --surface:#FFFFFF;
  --surface-2:#EEECF2;
  --line:#E3E0E9;
  --fg:#1B1A22;
  --muted:#65626F;
  --faint:#A09CAB;
  --ink:#FFFFFF;
  --scrim:rgba(20,18,30,.38);
  --shadow:0 1px 2px rgba(30,25,50,.05),0 6px 18px rgba(30,25,50,.05);
  --plan:#6C58E0;
  --food:#D27A26;
  --money:#12916A;
  --in:#12916A;
  --over:#D93A42;
  --h-apricot:#D27A26;
  --h-sky:#3576DD;
  --h-lav:#7556DC;
  --h-rose:#D2437B;
  --h-yellow:#A88508;
  --h-cyan:#118CA2;
  --h-tan:#956C43;
  --h-lime:#55911A;
  --h-green:#12916A;
  --h-grey:#7A7785;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.c-plan{color:var(--plan)}.c-food{color:var(--food)}.c-money{color:var(--money)}.c-over{color:var(--over)}.c-in{color:var(--in)}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 12px}
.when{flex:1;min-width:0;display:grid;gap:3px}
.wd-row{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.wd-wrap{position:relative;min-width:0}
.wd{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.15;white-space:nowrap}
.pick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.pill:disabled{cursor:default;color:var(--muted)}
.sub{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--money)}
.sync[data-s="busy"] i{background:var(--food)}
.sync[data-s="off"] i{background:var(--over)}
.sync[data-s="local"] i{background:var(--faint)}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:var(--shadow)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn:disabled{opacity:.35;cursor:default}

/* views */
.view{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding-top:4px}
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.title2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.link{font-size:14px;font-weight:600;padding:6px 0 6px 12px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.list{background:var(--surface);border-radius:var(--r);padding:2px 16px;box-shadow:var(--shadow)}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}

/* icon tiles */
.ico{--h:var(--h-grey);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--h);background:var(--surface-2);background:color-mix(in srgb,var(--h) 17%,transparent)}
.ico svg{width:22px;height:22px}
.ico.sm{width:34px;height:34px;border-radius:10px}
.ico.sm svg{width:19px;height:19px}

/* wallet */
.wallet{display:grid;gap:14px}
.w-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.eye{width:36px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.eye svg{width:20px;height:20px}
.w-bal{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.w-set{justify-self:start;font-size:14px;font-weight:600;color:var(--money);padding:4px 0}
.w-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border-top:1px solid var(--line);padding-top:14px}
.w-cell{display:flex;align-items:center;gap:10px;min-width:0}
.w-cell span{display:block;font-size:12.5px;color:var(--muted)}
.w-cell b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* action grid */
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--surface);border-radius:var(--r);padding:12px 6px;box-shadow:var(--shadow)}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px;font-size:12.5px;font-weight:500;text-align:center;line-height:1.3;border-radius:14px}
.act:active{background:var(--surface-2)}
.act .ico{width:50px;height:50px;border-radius:16px}
.act .ico svg{width:26px;height:26px}

/* metrics */
.metric{display:grid;gap:9px;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
button.metric:active{background:var(--surface-2)}
.m-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:8px}
.tag i{width:9px;height:9px;border-radius:3px;flex:none}
.m-val{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.m-val.text{font-size:20px;letter-spacing:-.01em;line-height:1.25}
.m-unit{font-size:15px;font-weight:500;color:var(--muted);margin-left:5px;letter-spacing:0}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:inherit;background:currentColor;transition:width .3s ease}
.m-foot{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
.stat{display:grid;gap:2px;min-width:0}
.stat span{font-size:12.5px;color:var(--muted)}
.stat b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat small{font-size:12px;color:var(--faint)}

.note{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.note p{color:var(--muted);font-size:14px}
.note b{font-size:15px}

/* rows */
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding-block:10px;border-bottom:1px solid var(--line);text-align:left}
.list>.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0;display:grid;gap:1px;text-align:left}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row-meta{font-size:12.5px;color:var(--muted)}
.row-amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.row-amt small{font-weight:500;color:var(--muted);font-size:12px}
.time{font-family:var(--font-num);font-size:13px;color:var(--muted);width:46px;flex:none}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--plan);display:grid;place-items:center;flex:none;color:var(--ink)}
.check svg{width:16px;height:16px;opacity:0}
.check.on{background:var(--plan)}
.check.on svg{opacity:1}
.done .row-title{color:var(--faint);text-decoration:line-through}
.badge{display:inline-block;font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.nowline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--over);font-family:var(--font-num);padding-block:8px}
.nowline::after{content:"";flex:1;height:1px;background:var(--over);opacity:.55}
.empty{padding:18px 0;color:var(--muted);font-size:14px;display:grid;gap:12px;justify-items:start}
.loading{padding:18px 0;color:var(--faint);font-size:14px}
.cat-dot{width:10px;height:10px;border-radius:4px;flex:none;display:inline-block}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;padding-bottom:8px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.meal-h .lhs{display:flex;align-items:center;gap:10px}
.meal-h b{color:var(--fg);font-weight:600;font-size:14px}
.add-mini{font-size:13px;font-weight:600;padding:6px 0 6px 12px}

/* flow (thu chi theo tháng) */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav b{font-size:15px;font-weight:600}
.mnav .icon-btn{box-shadow:none;background:var(--surface-2)}
.flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ft{display:grid;gap:4px;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);min-width:0}
.ft span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.ft span svg{width:16px;height:16px}
.ft b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ft[aria-pressed="true"]{border-color:var(--fg)}
.cmp{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.cmp b{font-weight:600}
.donut{display:grid;justify-items:center;padding-top:6px}
.donut svg{width:200px;max-width:100%;height:auto;display:block}
.donut .d-lab{fill:var(--muted);font-size:11px;text-anchor:middle;font-family:var(--font-ui)}
.donut .d-val{fill:var(--fg);font-size:15px;font-weight:700;text-anchor:middle;font-family:var(--font-ui)}
.lg{display:grid;gap:4px}
.lg-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding-block:8px}
.lg-row .nm{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.lg-row .amt{text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.lg-row .amt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.lg-row .bar{height:4px;grid-column:2/4}
.lg-row>.ico{grid-row:span 2}

/* month calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-size:16px;font-weight:700}
.calhead .icon-btn{box-shadow:none;background:var(--surface-2)}
.seg.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.four button{font-size:13px;min-height:36px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wh{font-size:11.5px;font-weight:500;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{position:relative;min-width:0;min-height:60px;border-radius:10px;background:var(--surface-2);padding:5px;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;gap:4px;text-align:left;overflow:hidden}
.cell .cd{font-size:12.5px;font-weight:600;line-height:1.35;align-self:flex-start;padding:0 4px;border-radius:6px;font-variant-numeric:tabular-nums}
.cell.today .cd{background:var(--fg);color:var(--ink)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--fg)}
.cell.out{opacity:.38}
.cell .cv{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .inc{position:absolute;top:7px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--in)}
.mini{display:grid;gap:3px}
.mini i{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.mini i b{display:block;height:100%;border-radius:inherit}
.calsum{font-size:12.5px;color:var(--muted)}
.daysum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.ds{display:grid;gap:2px;padding:9px 7px;border-radius:12px;background:var(--surface-2);text-align:left;min-width:0}
.ds span{font-size:11.5px;color:var(--muted)}
.ds b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.chart svg{display:block;width:100%;height:auto}
.chart .cl{font-family:var(--font-num);font-size:10.5px;fill:var(--muted);text-anchor:middle}
.chart .cl.now{fill:var(--fg);font-weight:500}
.chart .cv{font-family:var(--font-num);font-size:9.5px;fill:var(--muted);text-anchor:middle}
.chart .tl{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dash{width:16px;border-top:1px dashed var(--muted)}
.hint{font-size:12.5px;color:var(--faint)}

/* time */
.seg.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg.five button{font-size:12.5px;min-height:36px}
.gh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.gh-top>div{display:grid;gap:2px;min-width:0}
.gh-top b{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.gh-top span{font-size:13px;color:var(--muted)}
.strip{position:relative;height:30px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.strip i{position:absolute;top:0;bottom:0}
.strip i.live{opacity:.7;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 5px,transparent 5px 10px)}
.strip .now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--fg)}
.ticks{display:flex;justify-content:space-between;font-family:var(--font-num);font-size:11px;color:var(--muted);margin-top:-6px}
.runrow{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:10px 10px 10px 12px}
.runrow .row-main b{font-weight:600;overflow-wrap:anywhere}
.runrow .clock{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.stop{background:var(--over);color:var(--ink)}
.bar.stack{display:flex}
.bar.stack>span{flex:none;border-radius:0}
.goal .bar{height:5px;margin-top:7px}
.mnav .mid{display:grid;justify-items:center;gap:1px;text-align:center;min-width:0}
.mnav .mid span{font-size:12px;color:var(--muted)}
.mnav .icon-btn:disabled{opacity:.3}
.netrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--muted);padding:0 2px}
.netrow b{font-size:16px;font-variant-numeric:tabular-nums}
.catbtn span{overflow-wrap:anywhere}
.catbtn.add{background:none;border:1.5px dashed var(--line);color:var(--muted)}
.icongrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.icb{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.icb svg{width:20px;height:20px}
.icb[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.huegrid{display:flex;flex-wrap:wrap;gap:10px}
.hue{width:32px;height:32px;border-radius:50%}
.hue[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.cat-prev{display:flex;align-items:center;gap:12px;font-size:16px;min-width:0}
.cat-prev b{overflow-wrap:anywhere}
.run{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px);z-index:15;display:flex;align-items:center;gap:6px;background:var(--fg);color:var(--ink);border-radius:99px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100% - 32px)}
.run-go{display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;min-width:0;color:inherit;font-size:14px;font-weight:500}
.run-go span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.run-go b{font-size:16px;font-variant-numeric:tabular-nums}
#run-dot{width:9px;height:9px;border-radius:50%;flex:none;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#run-dot{animation:none}}
.run-stop{min-height:34px;padding:0 14px;border-radius:99px;background:var(--over);color:var(--ink);font-weight:600;font-size:13.5px;flex:none}
body.running .app{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 86px)}
body.running .toast{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 70px)}
.btn.primary[data-k="time"]{background:var(--h-sky)}
.sh-body{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--nav-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--faint)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[data-tab="plan"][aria-current="page"]{color:var(--plan)}
.tab[data-tab="food"][aria-current="page"]{color:var(--food)}
.tab[data-tab="money"][aria-current="page"]{color:var(--money)}
.fab{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;font-weight:600;color:var(--fg);padding-bottom:9px}
.fab .disc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--ink);margin-top:-24px;box-shadow:0 0 0 5px var(--surface),0 6px 18px rgba(0,0,0,.25)}
.fab .disc svg{width:24px;height:24px}
.fab:active .disc{transform:scale(.96)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding-top:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:18px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar>span{transition:none}}
.grab{width:38px;height:4px;border-radius:9px;background:var(--line);justify-self:center}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h3{font-size:19px;font-weight:700;text-wrap:balance}
.sh-head .icon-btn{box-shadow:none;background:var(--surface-2)}
.field{display:grid;gap:7px;min-width:0}
.field>span,.lbl{font-size:12.5px;color:var(--muted)}
.inp{width:100%;min-width:0;min-height:46px;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:10px 12px;font-size:16px}
.inp:focus{outline:none;border-color:var(--muted)}
.inp::placeholder{color:var(--faint)}
.suf{position:relative}
.suf .inp{padding-right:52px}
.suf>span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line);padding-bottom:6px}
.amount b{font-size:30px;font-weight:700}
.amount input{flex:1;min-width:0;width:100%;background:none;border:0;font-size:38px;font-weight:700;letter-spacing:-.02em;outline:none;font-variant-numeric:tabular-nums;padding:0;color:inherit}
.amount input::placeholder{color:var(--faint)}
.amount span{font-size:22px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:7px 13px;border-radius:99px;background:var(--surface-2);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.catgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.catbtn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px 9px;border-radius:14px;border:1.5px solid transparent;font-size:12.5px;font-weight:500;text-align:center;line-height:1.25;background:var(--surface-2)}
.catbtn[aria-pressed="true"]{border-color:var(--fg)}
.quickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qbig{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface-2);font-weight:600;text-align:left}
.qbig small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px}
.sh-actions{display:flex;gap:10px;align-items:center}
.btn{min-height:48px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px}
.btn.primary{flex:1;color:var(--ink);background:var(--fg)}
.btn.primary[data-k="money"]{background:var(--money)}
.btn.primary[data-k="in"]{background:var(--in)}
.btn.primary[data-k="food"]{background:var(--food)}
.btn.primary[data-k="plan"]{background:var(--plan)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{color:var(--over);padding:0 8px}
.sugg{display:grid;background:var(--surface-2);border-radius:12px;overflow:hidden}
.sugg button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
.sugg button:last-child{border-bottom:0}
.sugg small{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
.total b{font-size:18px;color:var(--fg);font-variant-numeric:tabular-nums}
.check-line{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg)}
.check-line input{width:20px;height:20px;accent-color:var(--food)}
.err{font-size:13px;color:var(--over)}
.info{display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.info b{color:var(--fg);font-size:14px}
.info ol{margin:0;padding-left:18px;display:grid;gap:3px}
.food-mine{display:grid;background:var(--surface-2);border-radius:12px;padding:0 12px}
.food-mine .row{min-height:46px;padding-block:6px}
.food-mine .row:last-child{border-bottom:0}
.food-mine .icon-btn{width:32px;height:32px;background:none;box-shadow:none}

/* charts */
const CW = 330, CH = 158, CT = 20, CB = 26, CS = 6;
function xLabel(k, dense) {
  const d = parseKey(k), n = d.getDate(), isNow = k === S.today;
  if (!dense) return isNow ? 'Nay' : WD_SHORT[d.getDay()];
  if (n === 1 || n % 5 === 0) return String(n);
  if (isNow && n % 5 !== 1 && n % 5 !== 4 && n !== 2) return String(n);
  return '';
}
function barChart(keys, vals, target, color, fmt, label) {
  const ch = CH - CT - CB, y0 = CT + ch, dense = keys.length > 10;
  const max = (Math.max(target || 0, ...vals) * 1.15) || 1;
  const slot = (CW - CS * 2) / vals.length, bw = Math.min(24, slot * (dense ? 0.62 : 0.52));
  let s = `<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(label)}">`;
  s += `<line class="base" x1="${CS}" x2="${CW - CS}" y1="${y0}" y2="${y0}"/>`;
  vals.forEach((v, i) => {
    const k = keys[i], x = CS + slot * i + (slot - bw) / 2, cx = x + bw / 2;
    const isNow = k === S.today, isOver = target > 0 && v > target;
    if (v > 0) {
      const hh = Math.max(v / max * ch, 2), y = y0 - hh;
      s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="${dense ? 2 : 4}" style="fill:${isOver ? 'var(--over)' : color};opacity:${isNow ? 1 : 0.72}"/>`;
      if (!dense) s += `<text class="cv" x="${cx.toFixed(1)}" y="${(y - 6).toFixed(1)}">${fmt(v)}</text>`;
    }
    const lb = xLabel(k, dense);
    if (lb) s += `<text class="cl${isNow ? ' now' : ''}" x="${cx.toFixed(1)}" y="${CH - 8}">${lb}</text>`;
  });
  if (target > 0) {
    const ty = (y0 - target / max * ch).toFixed(1);
    s += `<line class="tl" x1="${CS}" x2="${CW - CS}" y1="${ty}" y2="${ty}"/>`;
  }
  return s + '</svg>';
}
/* stacked bars: one column per day, one segment per category */
function stackChart(keys, perDay, order, label) {
  const ch = CH - CT - CB, y0 = CT + ch, dense = keys.length > 10;
  const totals = perDay.map(o => Object.values(o).reduce((a, b) => a + b, 0));
  const max = Math.max(60, ...totals) * 1.15;
  const slot = (CW - CS * 2) / keys.length, bw = Math.min(24, slot * (dense ? 0.62 : 0.52));
  let s = `<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(label)}">`;
  s += `<line class="base" x1="${CS}" x2="${CW - CS}" y1="${y0}" y2="${y0}"/>`;
  keys.forEach((k, i) => {
    const x = CS + slot * i + (slot - bw) / 2, cx = x + bw / 2;
    let y = y0;
    order.forEach(c => {
      const v = perDay[i][c] || 0; if (!v) return;
      const hh = v / max * ch; y -= hh;
      s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hh - 0.6, 0.6).toFixed(1)}" style="fill:var(--h-${catOf('time', c).h})"/>`;
    });
    if (totals[i] && !dense) s += `<text class="cv" x="${cx.toFixed(1)}" y="${(y - 6).toFixed(1)}">${shortMin(totals[i])}</text>`;
    const lb = xLabel(k, dense);
    if (lb) s += `<text class="cl${k === S.today ? ' now' : ''}" x="${cx.toFixed(1)}" y="${CH - 8}">${lb}</text>`;
  });
  return s + '</svg>';
}
function donut(entries, total, label, center) {
  const R = 66, SW = 24, C = 2 * Math.PI * R, cx = 100;
  let s = `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(label)}"><g transform="rotate(-90 ${cx} ${cx})">`;
  s += `<circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke-width="${SW}" style="stroke:var(--surface-2)"/>`;
  if (total > 0) {
    const gap = entries.length > 1 ? 3 : 0;
    let off = 0;
    entries.forEach(e => {
      const len = e.v / total * C, dash = Math.max(len - gap, 0.6);
      s += `<circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke-width="${SW}" style="stroke:var(--h-${e.h})" stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
      off += len;
    });
  }
  s += `</g><text class="d-lab" x="${cx}" y="94">${esc(center[0])}</text><text class="d-val" x="${cx}" y="116">${esc(center[1])}</text></svg>`;
  return s;
}
function legendRows(entries, total, fmtV, sub) {
  return `<div class="lg">${entries.map(e => {
    const p = Math.round(e.v / total * 100);
    return `<div class="lg-row">${ico(e.i, e.h, 'sm')}<span class="nm">${esc(e.label)}</span><span class="amt">${fmtV(e.v)}<small>${sub ? sub(e, p) : p + '%'}</small></span><div class="bar" style="color:var(--h-${e.h})"><span style="width:${p}%"></span></div></div>`;
  }).join('')}</div>`;
}
function cmpText(delta, prevTotal, curTotal, p, word, fmt, upGood) {
  if (!prevTotal && !curTotal) return `Chưa có ${word} nào trong ${p.word} này và ${p.word} trước.`;
  if (!delta) return `${word[0].toUpperCase() + word.slice(1)} bằng với ${p.isCur ? 'cùng kỳ ' : ''}${p.word} trước.`;
  const good = upGood ? delta > 0 : delta < 0;
  return `<b class="${good ? 'c-in' : 'c-over'}">${delta > 0 ? 'Tăng' : 'Giảm'} ${fmt(Math.abs(delta))}</b> so với ${p.isCur ? 'cùng kỳ ' : ''}${p.word} trước`;
}

/* time */
function dayBlocks(k) {
  const out = [], d = dayData(k), prev = dayData(addDays(k, -1));
  (d ? d.times : []).forEach(t => {
    const a = toMin(t.s); if (a == null) return;
    out.push({a, b: Math.min(1440, a + (+t.min || 0)), c: catOf('time', t.cat)});
  });
  (prev ? prev.times : []).forEach(t => {
    const a = toMin(t.s); if (a == null) return;
    const end = a + (+t.min || 0);
    if (end > 1440) out.push({a: 0, b: Math.min(1440, end - 1440), c: catOf('time', t.cat)});
  });
  const tm = S.settings.timer;
  if (tm) {
    const st = new Date(tm.start), sk = keyOf(st);
    if (k >= sk && k <= S.today) {
      const a = sk === k ? st.getHours() * 60 + st.getMinutes() : 0, b = k === S.today ? nowMin() : 1440;
      if (b > a) out.push({a, b, c: catOf('time', tm.cat), live: true});
    }
  }
  return out;
}
function dayStrip(k) {
  const bl = dayBlocks(k);
  let h = `<div class="strip" role="img" aria-label="Các khoảng thời gian đã ghi trong ngày">`;
  bl.forEach(x => { h += `<i class="${x.live ? 'live' : ''}" style="left:${(x.a / 14.4).toFixed(2)}%;width:${Math.max((x.b - x.a) / 14.4, 0.5).toFixed(2)}%;background-color:var(--h-${x.c.h})"></i>`; });
  if (k === S.today) h += `<b class="now" style="left:${(nowMin() / 14.4).toFixed(2)}%"></b>`;
  return h + '</div><div class="ticks"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>24h</span></div>';
}
function runRow(tm) {
  const c = catOf('time', tm.cat), sk = keyOf(new Date(tm.start));
  return `<div class="runrow">${ico(c.i, c.h, 'sm')}<div class="row-main"><b>${esc(tm.note || c.label)}</b><span class="row-meta">Đang bấm giờ từ ${hm(tm.start)}${sk !== S.today ? ' ngày ' + dm(sk) : ''}</span></div><b class="clock run-live">${clockOf(Date.now() - tm.start)}</b><button class="btn sm stop" type="button" data-act="timer-stop">Dừng</button></div>`;
}
function goalsSection() {

function timeStats() {
  if (!S.allLoaded) return '<div class="card loading">Đang tải số liệu…</div>';
  const p = perInfo(), cur = timeTotals(p.from, p.to), prev = timeTotals(p.prev.from, p.prev.to);
  const entries = Object.entries(cur.cats).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1])
    .map(([id, v]) => { const c = catOf('time', id); return {id, v, h: c.h, i: c.i, label: c.label}; });
  const legend = entries.length ? legendRows(entries, cur.total, shortMin, (e, pc) => `${pc}% · TB ${shortMin(e.v / p.elapsed)}/ngày`)
    : `<p class="empty" style="padding:0;justify-items:center;text-align:center">Chưa ghi thời gian nào trong ${p.word} này.</p>`;
  const keys = rangeKeys(p.from, p.to), all = allDays();
  const perDay = keys.map(k => all[k] ? byCat(all[k].times, t => +t.min || 0) : {});
  const order = entries.map(e => e.id);
  return `<div class="card stack" style="gap:14px">
      ${periodHead()}
      <div class="flow">
        <div class="ft"><span>Tổng thời gian đã ghi</span><b>${cur.total ? fmtMin(cur.total) : '0 giờ'}</b></div>
        <div class="ft"><span>Trung bình mỗi ngày</span><b>${fmtMin(cur.total / p.elapsed)}</b></div>

function viewTime() {

function viewPlan() {

/* food */
function bodySection() {
  const es = [...S.body.entries].sort((a, b) => b.date.localeCompare(a.date));
  let inner;
  if (!S.bodyLoaded) inner = '<div class="loading">Đang tải số đo…</div>';
  else if (!es.length) inner = '<div class="empty">Chưa có số đo nào. Đo 2 tuần một lần, cùng giờ, cùng chỗ đứng.</div>';
  else inner = es.map((e, i) => {
    const prev = es[i + 1];
    const dk = prev && e.kg != null && prev.kg != null ? e.kg - prev.kg : null;
    const dw = prev && e.waist != null && prev.waist != null ? e.waist - prev.waist : null;
    const meta = [e.waist != null ? `Vòng bụng ${fmtDec(e.waist)} cm${dw ? ` (${signed(dw, '')})` : ''}` : 'Chưa đo vòng bụng', e.photo ? 'đã chụp ảnh' : ''].filter(Boolean).join(' · ');
    return `<button class="row" type="button" data-act="edit-body" data-date="${esc(e.date)}">
      ${ico('scale', 'sky', 'sm')}
      <span class="row-main"><span class="row-title">${fmtDayMonth(e.date)}</span><span class="row-meta">${meta}</span></span>
      <span class="row-amt">${e.kg != null ? fmtDec(e.kg) + ' kg' : '—'}${dk ? `<small style="display:block;text-align:right" class="${dk < 0 ? 'c-in' : ''}">${signed(dk, ' kg')}</small>` : ''}</span></button>`;
  }).join('');
  let sum = '';
  if (es.length) {
    const first = es[es.length - 1], next = addDays(es[0].date, 14);
    const dk = es.length > 1 && es[0].kg != null && first.kg != null ? es[0].kg - first.kg : null;
    const dw = es.length > 1 && es[0].waist != null && first.waist != null ? es[0].waist - first.waist : null;
    const parts = [dk != null ? signed(dk, ' kg') : '', dw != null ? signed(dw, ' cm vòng bụng') : ''].filter(Boolean);
    sum = `<p class="hint">${parts.length ? `So với lần đầu (${fmtDayMonth(first.date)}): ${parts.join(' · ')}. ` : ''}Lần đo tiếp theo: ${next <= S.today ? '<b style="color:var(--fg)">đến hạn rồi</b>' : fmtDayMonth(next)}.</p>`;
  }
  return `<div class="sec"><div class="sec-h"><h2 class="eyebrow">Cân nặng &amp; vòng bụng</h2><button class="link" style="color:var(--h-sky)" type="button" data-act="add-body">+ Ghi số đo</button></div><div class="list">${inner}</div>${sum}</div>`;
}
function viewFood() {
  const L = S.dayLoaded, d = S.day;
  let groups = '';
  if (!L) groups = '<div class="loading">Đang tải bữa ăn…</div>';
  else {
    groups = MEALS.map(m => {
      const list = d.meals.filter(x => (x.meal || 'vat') === m.id).sort((a, b) => (a.t || 0) - (b.t || 0));
      const sum = list.reduce((a, x) => a + mealTotal(x), 0);
      return `<div class="meal-g"><div class="meal-h"><span class="lhs">${ico(m.i, m.h, 'sm')}<span><b>${m.label}</b>${sum ? ` · <span class="num">${groupDigits(sum)} kcal</span>` : ''}</span></span><button class="add-mini c-food" type="button" data-act="add-food" data-meal="${m.id}">+ Thêm</button></div>
        ${list.map(x => `<button class="row" type="button" data-act="edit-meal" data-id="${esc(x.id)}">
          <span class="row-main"><span class="row-title">${esc(x.name)}${(+x.qty || 1) !== 1 ? ` <span class="muted">×${fmtQty(+x.qty)}</span>` : ''}</span>${x.price ? `<span class="row-meta">${vnd(x.price)}</span>` : ''}</span>
          <span class="row-amt">${groupDigits(mealTotal(x))} <small>kcal</small></span></button>`).join('')}</div>`;
    }).join('');
  }
  const wk = lastDays(7), vals = wk.map(k => dayKcal(dayData(k)));
  const kd = vals.filter(v => v > 0), avgK = kd.length ? Math.round(kd.reduce((a, b) => a + b, 0) / kd.length) : 0;
  const chart = S.allLoaded ? `<div class="sec"><div class="sec-h"><h2 class="eyebrow">Calo 7 ngày gần nhất</h2><span class="m-foot">${avgK ? 'TB ' + groupDigits(avgK) + ' kcal/ngày' : ''}</span></div>
    <div class="card chart">${barChart(wk, vals, S.settings.kcalGoal, 'var(--food)', shortKcal, 'Calo mỗi ngày trong 7 ngày gần nhất')}
    <div class="legend"><span><i class="dash"></i>Mục tiêu ${groupDigits(S.settings.kcalGoal)} kcal</span><span><i class="cat-dot" style="background:var(--over)"></i>Vượt mục tiêu</span></div></div></div>` : '';
  return `${kcalMetric(false)}
    <div class="sec"><div class="sec-h"><h2 class="eyebrow">Bữa ăn ${dayWord()}</h2><button class="link c-food" type="button" data-act="add-food">+ Thêm món</button></div>
      <div class="list">${groups}</div>
      <p class="hint">Calo của món có sẵn là ước tính cho một phần ăn thông thường.</p></div>
    ${chart}${bodySection()}`;
}
const VIEWS = {today: viewToday, plan: viewPlan, food: viewFood, money: viewMoney};

/* ---------- sheets ---------- */
let lastFocus = null;
function openSheet(html, mount) {
  const wrap = $('#sheet-wrap'), sh = $('#sheet');
  if (wrap.hidden) lastFocus = document.activeElement;
  sh.innerHTML = '<div class="grab"></div><div class="sh-body">' + html + '</div>';
  wrap.hidden = false;
  document.body.style.overflow = 'hidden';
  if (mount) mount(sh.querySelector('.sh-body'));
  sh.scrollTop = 0;
}
function closeSheet() {
  $('#sheet-wrap').hidden = true;
  $('#sheet').innerHTML = '';
  document.body.style.overflow = '';
  if (lastFocus && lastFocus.focus && lastFocus.isConnected) lastFocus.focus();
}
function armDelete(btn, fn, closeAfter = true) {
  btn.addEventListener('click', () => {
    if (btn.dataset.armed) { fn(); if (closeAfter) closeSheet(); return; }
    btn.dataset.armed = '1'; btn.textContent = 'Bấm lần nữa để xóa';
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = 'Xóa'; } }, 3500);
  });
}
function moneyInput(el, allowNeg) {
  el.addEventListener('input', () => {
    const neg = allowNeg && /^\s*[-−]/.test(el.value);
    const v = digits(el.value);
    el.value = v ? (neg ? '−' : '') + groupDigits(v) : (neg ? '−' : '');
  });
}
function showErr(sh, msg) { const e = $('.err', sh); e.textContent = msg; e.hidden = false; }
function chipGroup(container, attr, onPick) {
  container.addEventListener('click', e => {
    const b = e.target.closest(`[${attr}]`); if (!b) return;
    container.querySelectorAll(`[${attr}]`).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    onPick(b.getAttribute(attr));
  });
}
function dayPhrase(k = S.sel) {
  if (k === S.today) return 'hôm nay';
  const d = parseKey(k);
  return `${WD_LONG[d.getDay()].toLowerCase()}, ${d.getDate()}/${d.getMonth() + 1}`;
}
/* category grid with a "+" tile that opens the category creator */
function catGridHtml(kind, sel) {
  return catList(kind).map(c => `<button class="catbtn" type="button" data-cat="${esc(c.id)}" aria-pressed="${c.id === sel}">${ico(c.i, c.h)}<span>${esc(c.label)}</span></button>`).join('')
    + `<button class="catbtn add" type="button" data-addcat>${ico('plus', 'grey')}<span>Thêm mục</span></button>`;
}
function wireCatGrid(grid, onPick, onAdd) {
  grid.addEventListener('click', e => {
    if (e.target.closest('[data-addcat]')) { onAdd(); return; }
    const b = e.target.closest('[data-cat]'); if (!b) return;
    grid.querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    onPick(b.dataset.cat);
  });
}

      <button class="qbig" type="button" data-q="timer">${ico(tm ? 'stop' : 'play', tm ? 'rose' : 'green')}<span>${tm ? 'Dừng bấm giờ' : 'Bấm giờ'}<small>${tm ? esc(tm.note || catOf('time', tm.cat).label) : 'Bắt đầu một việc'}</small></span></button>
      <button class="qbig" type="button" data-q="food">${ico('bowl', 'apricot')}<span>Món ăn<small>Tính calo</small></span></button>

function openTx(kind, id, draft) {
  const listName = k => k === 'thu' ? 'incomes' : 'expenses';
  const rec = id ? S.day[listName(kind)].find(e => e.id === id) : null;
  if (id && !rec) return;
  if (!guard()) return;
  const dr = draft || {};
  let k = rec ? (kind === 'thu' ? 'thu' : 'chi') : (dr.k || (kind === 'thu' ? 'thu' : 'chi'));
  let cat = dr.cat || (rec ? rec.cat : (k === 'thu' ? 'luong' : 'an'));
  const amt0 = dr.amount != null ? dr.amount : (rec ? groupDigits(rec.amount) : '');
  const note0 = dr.note != null ? dr.note : (rec ? rec.note || '' : '');
  openSheet(`
    <div class="sh-head"><h3>${rec ? (k === 'thu' ? 'Sửa thu nhập' : 'Sửa khoản chi') : 'Giao dịch mới'}</h3>${closeBtn}</div>
    ${rec ? '' : `<div class="seg" id="tx-seg"><button type="button" data-k="chi" aria-pressed="${k === 'chi'}">Chi tiêu</button><button type="button" data-k="thu" aria-pressed="${k === 'thu'}">Thu nhập</button></div>`}
    <label class="amount" id="tx-amtwrap"><b id="tx-sign">${k === 'thu' ? '+' : '−'}</b><input id="tx-amt" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Số tiền" value="${esc(amt0)}"><span>đ</span></label>
    <div class="chips" id="tx-q">${[10, 20, 50, 100, 500].map(n => `<button class="chip" type="button" data-add="${n * 1000}">+${n}k</button>`).join('')}<button class="chip" type="button" data-add="0">Xóa số</button></div>
    <div class="field"><span class="lbl">Danh mục</span><div class="catgrid" id="tx-cat">${catGridHtml(k, cat)}</div></div>
    <label class="field"><span>Ghi chú (không bắt buộc)</span><input class="inp" id="tx-note" maxlength="80" autocomplete="off" value="${esc(note0)}"></label>
    <p class="hint">Ghi vào ${dayPhrase()}.</p>
    <p class="err" hidden></p>
    <div class="sh-actions">${rec ? '<button class="btn danger" type="button" id="tx-del">Xóa</button>' : ''}<button class="btn primary" type="button" id="tx-save"></button></div>`,
  sh => {
    const amt = $('#tx-amt', sh), grid = $('#tx-cat', sh), save = $('#tx-save', sh), wrap = $('#tx-amtwrap', sh), note = $('#tx-note', sh);
    const paintKind = () => {
      $('#tx-sign', sh).textContent = k === 'thu' ? '+' : '−';
      wrap.style.color = k === 'thu' ? 'var(--in)' : 'var(--fg)';
      save.dataset.k = k === 'thu' ? 'in' : 'money';
      save.textContent = rec ? 'Lưu thay đổi' : (k === 'thu' ? 'Thêm thu nhập' : 'Thêm khoản chi');
      note.placeholder = k === 'thu' ? 'vd: lương tháng 11, mẹ gửi' : 'vd: cơm trưa, đổ xăng';
    };
    paintKind();
    moneyInput(amt);
    $('#tx-q', sh).addEventListener('click', e => {
      const b = e.target.closest('[data-add]'); if (!b) return;
      const add = +b.dataset.add, v = add ? digits(amt.value) + add : 0;
      amt.value = v ? groupDigits(v) : '';
    });
    wireCatGrid(grid, v => { cat = v; }, () => {
      const back = {k, cat, amount: amt.value, note: note.value};
      openCatEditor(k, newCat => openTx(kind, id, Object.assign(back, newCat ? {cat: newCat} : {})));
    });
    const seg = $('#tx-seg', sh);
    if (seg) seg.addEventListener('click', e => {
      const b = e.target.closest('[data-k]'); if (!b || b.dataset.k === k) return;
      k = b.dataset.k; cat = k === 'thu' ? 'luong' : 'an';
      seg.querySelectorAll('[data-k]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      grid.innerHTML = catGridHtml(k, cat);
      paintKind();
    });
    save.addEventListener('click', () => {
      const amount = digits(amt.value);
      if (!amount) { showErr(sh, 'Nhập số tiền trước khi lưu.'); amt.focus(); return; }
      const nt = note.value.trim();
      const ok = mutateDay(d => {
        const list = d[listName(k)];
        let r = rec ? list.find(e => e.id === rec.id) : null;
        if (!r) { r = {id: newId(), t: Date.now()}; list.push(r); }
        Object.assign(r, {amount, cat, note: nt});
        if (k === 'chi' && r.mealId) { const m = d.meals.find(x => x.id === r.mealId); if (m) m.price = amount; }
      });
      if (ok) { closeSheet(); toast(rec ? 'Đã lưu thay đổi' : (k === 'thu' ? `Đã ghi thu +${vnd(amount)}` : `Đã ghi chi ${vnd(amount)}`)); }
    });
    if (rec) armDelete($('#tx-del', sh), () => mutateDay(d => {
      d[listName(k)] = d[listName(k)].filter(e => e.id !== rec.id);
      if (k === 'chi') d.meals.forEach(m => { if (m.exId === rec.id) { delete m.exId; delete m.price; } });
    }));
    if (!rec && !draft) setTimeout(() => amt.focus(), 80);
  });
}

/* create a category of your own: name, icon, colour */
function openCatEditor(kind, back) {
  kind = kindOf(kind);
  if (!guardSettings()) return;
  let icon = 'star', hue = 'sky';
  const ph = kind === 'time' ? 'vd: Đọc sách, Làm khóa luận' : kind === 'thu' ? 'vd: Bán hàng online' : 'vd: Thú cưng, Quà tặng';
  openSheet(`
    <div class="sh-head"><h3>Danh mục ${KIND_NAME[kind].toLowerCase()} mới</h3>${closeBtn}</div>
    <div class="cat-prev"><span id="ce-ico">${ico(icon, hue)}</span><b id="ce-prev">Tên danh mục</b></div>
    <label class="field"><span>Tên danh mục</span><input class="inp" id="ce-name" maxlength="24" autocomplete="off" placeholder="${ph}"></label>
    <div class="field"><span class="lbl">Biểu tượng</span><div class="icongrid" id="ce-icons">${ICONS.map((n, i) => `<button type="button" class="icb" data-i="${n}" aria-pressed="${n === icon}" aria-label="Biểu tượng ${i + 1}">${svg(n)}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Màu</span><div class="huegrid" id="ce-hues">${HUES.map((h, i) => `<button type="button" class="hue" data-h="${h}" aria-pressed="${h === hue}" style="background:var(--h-${h})" aria-label="Màu ${i + 1}"></button>`).join('')}</div></div>
    <p class="err" hidden></p>
    <div class="sh-actions"><button class="btn ghost" type="button" id="ce-back">${back ? 'Quay lại' : 'Hủy'}</button><button class="btn primary" type="button" id="ce-save">Tạo danh mục</button></div>`,
  sh => {
    const name = $('#ce-name', sh), paint = () => { $('#ce-ico', sh).innerHTML = ico(icon, hue); };
    name.addEventListener('input', () => { $('#ce-prev', sh).textContent = name.value.trim() || 'Tên danh mục'; });
    chipGroup($('#ce-icons', sh), 'data-i', v => { icon = v; paint(); });
    chipGroup($('#ce-hues', sh), 'data-h', v => { hue = v; paint(); });
    $('#ce-back', sh).addEventListener('click', () => { if (back) back(null); else closeSheet(); });
    $('#ce-save', sh).addEventListener('click', () => {
      const label = name.value.trim().replace(/\s+/g, ' ');
      if (!label) { showErr(sh, 'Đặt tên cho danh mục.'); name.focus(); return; }
      if (catList(kind).some(c => fold(c.label) === fold(label))) { showErr(sh, 'Đã có danh mục tên này rồi.'); name.focus(); return; }
      const id = 'c' + newId();
      const ok = mutateSettings(s => { s.cats[kind].push({id, label, i: icon, h: hue, hidden: false}); });
      if (!ok) return;
      toast(`Đã thêm danh mục ${label}`);
      if (back) back(id); else closeSheet();
    });
    setTimeout(() => name.focus(), 80);
  });
}

      ${list.length ? `<div class="food-mine">${list.map(c => `<div class="row">${ico(c.i, c.h, 'sm')}<span class="row-main"><span class="row-title">${esc(c.label)}</span></span><button class="btn danger" type="button" data-rm="${kind}|${esc(c.id)}">Xóa</button></div>`).join('')}</div>` : '<p class="hint">Chưa có danh mục riêng.</p>'}</div>`;
  };

    <div class="stack" id="cats-body">${group('chi')}${group('thu')}${group('time')}</div>`,
  sh => {
    $('#cats-body', sh).addEventListener('click', e => {
      const n = e.target.closest('[data-new]');
      if (n) { openCatEditor(n.dataset.new, () => openCats()); return; }
      const r = e.target.closest('[data-rm]'); if (!r) return;
      if (!r.dataset.armed) {
        r.dataset.armed = '1'; r.textContent = 'Bấm lần nữa';
        setTimeout(() => { if (r.isConnected) { delete r.dataset.armed; r.textContent = 'Xóa'; } }, 3500);

/* time entries */
function openTime(id, draft) {
  const dr = draft || {};
  const dateKey = dr.date || S.sel;
  if (!guard()) return;
  if (dateKey !== S.sel && !S.allLoaded) { toast(LOADING); return; }
  const src = dateKey === S.sel ? S.day : normDay(S.days[dateKey] || null, dateKey);
  const t = id ? src.times.find(x => x.id === id) : null;
  if (id && !t) return;
  let cat = dr.cat || (t ? t.cat : 'hoc');
  let s0 = dr.s || (t ? t.s : ''), e0 = dr.e || (t ? t.e : '');
  if (!s0 || !e0) {
    const ends = src.times.map(x => (toMin(x.s) || 0) + (+x.min || 0)).filter(m => m < 1440);
    const lastEnd = ends.length ? Math.max(...ends) : null;
    if (dateKey === S.today) {
      const now = Math.floor(nowMin() / 5) * 5;
      e0 = fromMin(now);
      s0 = fromMin(lastEnd != null && lastEnd < now ? lastEnd : now - 60);
    } else {
      s0 = fromMin(lastEnd != null ? lastEnd : 8 * 60);
      e0 = fromMin(toMin(s0) + 60);
    }
  }
  const note0 = dr.note != null ? dr.note : (t ? t.note || '' : '');
  openSheet(`
    <div class="sh-head"><h3>${t ? 'Sửa hoạt động' : dr.fromTimer ? 'Lưu thời gian đã bấm' : 'Ghi thời gian'}</h3>${closeBtn}</div>
    <div class="field"><span class="lbl">Bạn đã làm gì?</span><div class="catgrid" id="tm-cat">${catGridHtml('time', cat)}</div></div>
    <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <label class="field"><span>Bắt đầu</span><input class="inp" type="time" id="tm-s" value="${esc(s0)}"></label>
      <label class="field"><span>Kết thúc</span><input class="inp" type="time" id="tm-e" value="${esc(e0)}"></label>
    </div>
    <div class="chips" id="tm-q">${[15, 30, 45, 60, 90, 120].map(m => `<button class="chip" type="button" data-m="${m}">${durLabel(m)}</button>`).join('')}</div>
    <div class="total"><span id="tm-hint">Thời lượng</span><b id="tm-total"></b></div>
    <label class="field"><span>Ghi chú (không bắt buộc)</span><input class="inp" id="tm-note" maxlength="80" autocomplete="off" placeholder="vd: Ôn Marketing quốc tế, làm khóa luận" value="${esc(note0)}"></label>
    <p class="hint">Ghi vào ${dayPhrase(dateKey)}. Giờ kết thúc nhỏ hơn giờ bắt đầu nghĩa là kết thúc vào hôm sau, như giấc ngủ đêm.</p>
    <p class="err" hidden></p>
    <div class="sh-actions">${t ? '<button class="btn danger" type="button" id="tm-del">Xóa</button>' : dr.fromTimer ? '<button class="btn danger" type="button" id="tm-drop">Bỏ bấm giờ</button>' : ''}<button class="btn primary" data-k="time" type="button" id="tm-save">${t ? 'Lưu thay đổi' : 'Lưu'}</button></div>`,
  sh => {
    const sEl = $('#tm-s', sh), eEl = $('#tm-e', sh), note = $('#tm-note', sh);
    const upd = () => {
      const m = spanMin(sEl.value, eEl.value), cross = toMin(eEl.value) != null && toMin(sEl.value) != null && toMin(eEl.value) <= toMin(sEl.value);
      $('#tm-total', sh).textContent = sEl.value && eEl.value && sEl.value !== eEl.value ? fmtMin(m) : '—';
      $('#tm-hint', sh).textContent = cross && sEl.value !== eEl.value ? 'Thời lượng (kết thúc hôm sau)' : 'Thời lượng';
    };
    upd();
    sEl.addEventListener('input', upd); eEl.addEventListener('input', upd);
    sEl.addEventListener('change', upd); eEl.addEventListener('change', upd);
    $('#tm-q', sh).addEventListener('click', e => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      const s = toMin(sEl.value);
      if (s == null) { eEl.value = fromMin(nowMin()); sEl.value = fromMin(nowMin() - +b.dataset.m); }
      else eEl.value = fromMin(s + +b.dataset.m);
      upd();
    });
    wireCatGrid($('#tm-cat', sh), v => { cat = v; }, () => {
      const back = Object.assign({}, dr, {cat, s: sEl.value, e: eEl.value, note: note.value, date: dateKey});
      openCatEditor('time', nc => openTime(id, Object.assign(back, nc ? {cat: nc} : {})));
    });
    $('#tm-save', sh).addEventListener('click', () => {
      const s = sEl.value, e = eEl.value;
      if (toMin(s) == null || toMin(e) == null) { showErr(sh, 'Chọn giờ bắt đầu và giờ kết thúc.'); return; }
      if (s === e) { showErr(sh, 'Giờ kết thúc phải khác giờ bắt đầu.'); return; }
      const min = spanMin(s, e), nt = note.value.trim();
      const ok = mutateDayKey(dateKey, d => {
        let r = t ? d.times.find(x => x.id === t.id) : null;
        if (!r) { r = {id: newId(), t: Date.now()}; d.times.push(r); }
        Object.assign(r, {cat, s, e, min, note: nt});
      });
      if (!ok) return;
      if (dr.fromTimer) mutateSettings(st => { st.timer = null; });
      closeSheet();
      toast(t ? 'Đã lưu thay đổi' : `Đã ghi ${fmtMin(min)} ${catOf('time', cat).label}`);
    });
    if (t) armDelete($('#tm-del', sh), () => mutateDayKey(dateKey, d => { d.times = d.times.filter(x => x.id !== t.id); }));
    const drop = $('#tm-drop', sh);
    if (drop) armDelete(drop, () => { mutateSettings(st => { st.timer = null; }); toast('Đã bỏ lượt bấm giờ'); });
  });
}
function openTimerStart(draft) {
  if (!guardSettings()) return;
  if (S.settings.timer) { stopTimer(); return; }
  const dr = draft || {};
  let cat = dr.cat || 'hoc';
  openSheet(`
    <div class="sh-head"><h3>Bấm giờ</h3>${closeBtn}</div>
    <p class="hint">Bắt đầu khi bắt tay vào việc, xong thì bấm Dừng ở thanh phía dưới. Đồng hồ vẫn chạy khi bạn đóng app và hiện trên cả máy tính.</p>
    <div class="field"><span class="lbl">Bạn sắp làm gì?</span><div class="catgrid" id="tr-cat">${catGridHtml('time', cat)}</div></div>
    <label class="field"><span>Ghi chú (không bắt buộc)</span><input class="inp" id="tr-note" maxlength="80" autocomplete="off" placeholder="vd: Làm chương 2 khóa luận" value="${esc(dr.note || '')}"></label>
    <div class="sh-actions"><button class="btn primary" data-k="time" type="button" id="tr-go">Bắt đầu</button></div>`,
  sh => {
    const note = $('#tr-note', sh);
    wireCatGrid($('#tr-cat', sh), v => { cat = v; }, () => {
      const back = {cat, note: note.value};
      openCatEditor('time', nc => openTimerStart(Object.assign(back, nc ? {cat: nc} : {})));
    });
    $('#tr-go', sh).addEventListener('click', () => {
      const nt = note.value.trim();
      if (mutateSettings(s => { s.timer = {cat, note: nt, start: Date.now()}; })) { closeSheet(); toast(`Bắt đầu bấm giờ: ${nt || catOf('time', cat).label}`); }
    });
  });
}
function stopTimer() {
  const tm = S.settings.timer; if (!tm) return;
  const st = new Date(tm.start);
  let e = nowHM();
  if (Date.now() - tm.start >= 86400000) e = fromMin(st.getHours() * 60 + st.getMinutes() + 60);
  if (e === hm(tm.start)) e = fromMin(toMin(e) + 1);
  openTime(null, {cat: tm.cat, note: tm.note, date: keyOf(st), s: hm(tm.start), e, fromTimer: true});
}
function openGoal(i, draft) {
  if (!guardSettings()) return;

    <label class="field"><span>Số giờ mỗi tuần</span><div class="suf"><input class="inp" id="gl-h" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(dr.h != null ? dr.h : g ? fmtDec(g.h) : '')}"><span>giờ</span></div></label>
    <div class="chips" id="gl-q">${[3, 5, 10, 15, 20, 30].map(h => `<button class="chip" type="button" data-h="${h}">${h} giờ</button>`).join('')}</div>

  sh => {

    wireCatGrid($('#gl-cat', sh), v => { cat = v; }, () => {

    $('#gl-save', sh).addEventListener('click', () => {

      if (mutateSettings(s => { s.goals = s.goals.filter((x, j) => j !== i && x.cat !== cat).concat([{cat, h}]); })) { closeSheet(); toast('Đã lưu mục tiêu tuần'); }
    });
    if (g) armDelete($('#gl-del', sh), () => mutateSettings(s => { s.goals = s.goals.filter((x, j) => j !== i); }));
  });
}

function openFood(id, mealPreset) {
  const m = id ? S.day.meals.find(x => x.id === id) : null;
  if (id && !m) return;
  if (!guard()) return;
  let meal = m ? (m.meal || 'vat') : (mealPreset || guessMeal());
  let qty = m ? (+m.qty || 1) : 1;
  openSheet(`
    <div class="sh-head"><h3>${m ? 'Sửa món ăn' : 'Món ăn mới'}</h3>${closeBtn}</div>
    <div class="chips" id="ft-meal">${MEALS.map(x => `<button class="chip" type="button" data-meal="${x.id}" aria-pressed="${x.id === meal}">${x.label}</button>`).join('')}</div>
    <label class="field"><span>Tên món</span><input class="inp" id="ft-name" maxlength="60" autocomplete="off" placeholder="Tìm hoặc gõ tên món" value="${esc(m ? m.name : '')}"></label>
    <div class="sugg" id="ft-sugg"${m ? ' hidden' : ''}></div>
    <div class="grid2">
      <label class="field"><span>Calo 1 phần</span><div class="suf"><input class="inp" id="ft-kcal" inputmode="numeric" autocomplete="off" placeholder="0" value="${m ? m.kcal : ''}"><span>kcal</span></div></label>
      <div class="field"><span class="lbl">Số phần</span><div class="chips" id="ft-qty">${[0.5, 1, 1.5, 2].map(q => `<button class="chip" type="button" data-q="${q}" aria-pressed="${q === qty}">${fmtQty(q)}</button>`).join('')}</div></div>
    </div>
    <div class="total"><span>Tổng</span><b id="ft-total">0 kcal</b></div>
    <label class="field"><span>Giá tiền (không bắt buộc, có giá thì tự ghi vào Thu chi)</span><div class="suf"><input class="inp" id="ft-price" inputmode="numeric" autocomplete="off" placeholder="0" value="${m && m.price ? groupDigits(m.price) : ''}"><span>đ</span></div></label>
    ${m ? '' : '<label class="check-line"><input type="checkbox" id="ft-keep"> Lưu vào “Món của tôi” để lần sau chọn nhanh</label>'}
    <p class="err" hidden></p>
    <div class="sh-actions">${m ? '<button class="btn danger" type="button" id="ft-del">Xóa</button>' : ''}<button class="btn primary" data-k="food" type="button" id="ft-save">${m ? 'Lưu thay đổi' : 'Thêm món'}</button></div>`,
  sh => {
    const name = $('#ft-name', sh), kcal = $('#ft-kcal', sh), price = $('#ft-price', sh), sugg = $('#ft-sugg', sh), total = $('#ft-total', sh);
    const upd = () => { total.textContent = groupDigits(Math.round(digits(kcal.value) * qty)) + ' kcal'; };
    const allFoods = () => S.settings.foods.map(f => ({name: f.name, kcal: +f.kcal || 0, mine: true})).concat(FOODS);
    const drawSugg = () => {
      const q = fold(name.value.trim());
      const list = (q ? allFoods().filter(f => fold(f.name).includes(q)) : allFoods()).slice(0, q ? 6 : 8);
      sugg.innerHTML = list.map((f, i) => `<button type="button" data-i="${i}"><span>${esc(f.name)}</span><small>${groupDigits(f.kcal)} kcal${f.mine ? ' · của tôi' : ''}</small></button>`).join('');
      sugg.hidden = !list.length;
      sugg._list = list;
    };
    if (!m) drawSugg();
    upd();
    name.addEventListener('input', drawSugg);
    name.addEventListener('focus', drawSugg);
    sugg.addEventListener('click', e => {
      const b = e.target.closest('[data-i]'); if (!b) return;
      const f = sugg._list[+b.dataset.i];
      name.value = f.name; kcal.value = f.kcal; upd(); sugg.hidden = true;
    });
    kcal.addEventListener('input', () => { const v = digits(kcal.value); kcal.value = v ? String(v) : ''; upd(); });
    moneyInput(price);
    chipGroup($('#ft-meal', sh), 'data-meal', v => { meal = v; });
    chipGroup($('#ft-qty', sh), 'data-q', v => { qty = +v; upd(); });
    $('#ft-save', sh).addEventListener('click', () => {
      const n = name.value.trim(), k = digits(kcal.value), p = digits(price.value);
      if (!n) { showErr(sh, 'Nhập tên món.'); name.focus(); return; }
      if (!k) { showErr(sh, 'Nhập lượng calo cho 1 phần, ước tính cũng được.'); kcal.focus(); return; }
      const keep = $('#ft-keep', sh);
      const ok = mutateDay(d => {
        let rec = m ? d.meals.find(x => x.id === m.id) : null;
        if (!rec) { rec = {id: newId(), t: Date.now()}; d.meals.push(rec); }
        Object.assign(rec, {meal, name: n, kcal: k, qty});
        let ex = rec.exId ? d.expenses.find(e => e.id === rec.exId) : null;
        if (p > 0) {
          if (!ex) { ex = {id: newId(), t: Date.now(), cat: 'an', mealId: rec.id}; d.expenses.push(ex); rec.exId = ex.id; }
          ex.amount = p; ex.note = n; rec.price = p;
        } else {
          if (ex) d.expenses = d.expenses.filter(e => e.id !== ex.id);
          delete rec.exId; delete rec.price;
        }
      });
      if (!ok) return;
      if (keep && keep.checked) {
        const fn = fold(n);
        if (!allFoods().some(f => fold(f.name) === fn) && S.settingsLoaded) mutateSettings(s => { s.foods.push({name: n, kcal: k}); });
      }
      closeSheet();
      toast(m ? 'Đã lưu thay đổi' : `Đã thêm ${n}${p ? ' và ghi chi ' + vnd(p) : ''}`);
    });
    if (m) armDelete($('#ft-del', sh), () => mutateDay(d => {
      const rec = d.meals.find(x => x.id === m.id);
      if (rec && rec.exId) d.expenses = d.expenses.filter(e => e.id !== rec.exId);
      d.meals = d.meals.filter(x => x.id !== m.id);
    }));
  });
}

    </div>
    <p class="err" hidden></p>
    <div class="sh-actions">${r ? '<button class="btn danger" type="button" id="rt-del">Xóa</button>' : ''}<button class="btn primary" data-k="plan" type="button" id="rt-save">${r ? 'Lưu thay đổi' : 'Thêm vào lịch cố định'}</button></div>`,
  sh => {
    const box = $('#rt-days', sh);
    const paint = () => box.querySelectorAll('[data-d]').forEach(b => b.setAttribute('aria-pressed', String(days.includes(+b.dataset.d))));
    box.addEventListener('click', e => {
      const b = e.target.closest('[data-d]'); if (!b) return;
      const d = +b.dataset.d;
      days = days.includes(d) ? days.filter(x => x !== d) : days.concat(d);
      paint();
    });
    $('#rt-preset', sh).addEventListener('click', e => {
      const b = e.target.closest('[data-p]'); if (!b) return;
      days = b.dataset.p === 'all' ? [0, 1, 2, 3, 4, 5, 6] : b.dataset.p === 'wk' ? [1, 2, 3, 4, 5] : [0, 6];
      paint();
    });
    $('#rt-save', sh).addEventListener('click', () => {
      const title = $('#rt-title', sh).value.trim(), time = $('#rt-time', sh).value || '';
      if (!title) { showErr(sh, 'Nhập tên việc.'); $('#rt-title', sh).focus(); return; }
      if (!days.length) { showErr(sh, 'Chọn ít nhất một ngày trong tuần.'); return; }
      const ok = mutateSettings(s => {
        let rec = r ? s.routine.find(x => x.id === r.id) : null;
        if (!rec) { rec = {id: newId()}; s.routine.push(rec); }
        Object.assign(rec, {title, time, days: [...days].sort()});
      });
      if (ok) { closeSheet(); toast(r ? 'Đã lưu lịch cố định' : 'Đã thêm vào lịch cố định'); }
    });
    if (r) armDelete($('#rt-del', sh), () => mutateSettings(s => { s.routine = s.routine.filter(x => x.id !== r.id); }));
  });
}

function openBody(date) {
  if (!Store.ready || !S.bodyLoaded) { toast(LOADING); return; }
  const e = date ? S.body.entries.find(x => x.date === date) : null;
  openSheet(`
    <div class="sh-head"><h3>${e ? 'Sửa số đo' : 'Ghi số đo'}</h3>${closeBtn}</div>
    <p class="hint">Đo 2 tuần một lần, cùng giờ, cùng chỗ đứng. Vòng bụng đo ngang rốn.</p>
    <label class="field"><span>Ngày đo</span><input class="inp" type="date" id="bd-date" value="${e ? esc(e.date) : S.today}"></label>
    <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <label class="field"><span>Cân nặng</span><div class="suf"><input class="inp" id="bd-kg" inputmode="decimal" autocomplete="off" placeholder="0" value="${e && e.kg != null ? fmtDec(e.kg) : ''}"><span>kg</span></div></label>
      <label class="field"><span>Vòng bụng</span><div class="suf"><input class="inp" id="bd-w" inputmode="decimal" autocomplete="off" placeholder="0" value="${e && e.waist != null ? fmtDec(e.waist) : ''}"><span>cm</span></div></label>
    </div>
    <label class="check-line"><input type="checkbox" id="bd-photo"${e && e.photo ? ' checked' : ''}> Đã chụp ảnh tiến độ</label>
    <p class="err" hidden></p>
    <div class="sh-actions">${e ? '<button class="btn danger" type="button" id="bd-del">Xóa</button>' : ''}<button class="btn primary" data-k="time" type="button" id="bd-save">Lưu số đo</button></div>`,
  sh => {
    $('#bd-save', sh).addEventListener('click', () => {
      const dt = $('#bd-date', sh).value, kg = parseDec($('#bd-kg', sh).value), w = parseDec($('#bd-w', sh).value), photo = $('#bd-photo', sh).checked;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dt)) { showErr(sh, 'Chọn ngày đo.'); return; }
      if (kg == null && w == null) { showErr(sh, 'Nhập cân nặng hoặc vòng bụng.'); return; }
      if ((kg != null && (kg < 25 || kg > 300)) || (w != null && (w < 40 || w > 200))) { showErr(sh, 'Số đo có vẻ chưa đúng, kiểm tra lại giúp mình.'); return; }
      const ok = mutateBody(b => {
        b.entries = b.entries.filter(x => x.date !== dt && (!e || x.date !== e.date));
        b.entries.push({date: dt, kg, waist: w, photo});
      });
      if (ok) { closeSheet(); toast('Đã lưu số đo'); }
    });
    if (e) armDelete($('#bd-del', sh), () => mutateBody(b => { b.entries = b.entries.filter(x => x.date !== e.date); }));
  });
}

function openSettings() {
  if (!guardSettings()) return;
  const st = S.settings;
  let foods = st.foods.map(f => ({name: f.name, kcal: +f.kcal || 0}));
  let skin = st.skin;
  openSheet(`
    <div class="sh-head"><h3>Cài đặt</h3>${closeBtn}</div>
    <label class="field"><span>Ngân sách chi tiêu mỗi ngày</span><div class="suf"><input class="inp" id="st-budget" inputmode="numeric" autocomplete="off" value="${groupDigits(st.budget)}"><span>đ</span></div></label>
    <label class="field"><span>Mục tiêu calo mỗi ngày</span><div class="suf"><input class="inp" id="st-kcal" inputmode="numeric" autocomplete="off" value="${st.kcalGoal}"><span>kcal</span></div></label>
    <div class="field"><span class="lbl">Giao diện</span><div class="seg" id="st-skin"><button type="button" data-s="dark" aria-pressed="${skin === 'dark'}">Tối</button><button type="button" data-s="light" aria-pressed="${skin === 'light'}">Sáng</button></div></div>
    <div class="field"><span class="lbl">Món của tôi</span><div id="st-foods"></div></div>
    <p class="err" hidden></p>
    <div class="sh-actions"><button class="btn primary" type="button" id="st-save">Lưu cài đặt</button></div>
    <button class="btn ghost" type="button" id="st-cats">Danh mục của tôi</button>
    <div class="info"><b>Dữ liệu của bạn</b><p>Mọi thứ bạn ghi chỉ lưu trên máy này, không gửi đi đâu và không ai khác xem được. Xóa app hoặc xóa dữ liệu trình duyệt sẽ mất dữ liệu, nên thỉnh thoảng sao lưu ra file. File sao lưu cũng dùng để chuyển dữ liệu sang máy khác.</p><p>${lastBackup() ? 'Lần sao lưu gần nhất: ' + new Date(lastBackup()).toLocaleDateString('vi-VN') : 'Chưa sao lưu lần nào.'}</p></div>
    <div class="sh-actions two"><button class="btn ghost" type="button" id="st-export">Sao lưu ra file</button><label class="btn ghost" for="st-file">Khôi phục từ file</label></div>
    <input class="vh" type="file" id="st-file" accept=".json,application/json">
    <p class="hint">Nhịp Ngày · phiên bản ${APP_VERSION}</p>`,
  sh => {
    const box = $('#st-foods', sh);
    const draw = () => {
      box.innerHTML = foods.length
        ? `<div class="food-mine">${foods.map((f, i) => `<div class="row"><span class="row-main"><span class="row-title">${esc(f.name)}</span><span class="row-meta">${groupDigits(f.kcal)} kcal</span></span><button class="icon-btn" type="button" data-rm="${i}" aria-label="Bỏ ${esc(f.name)}">${svg('x', 2)}</button></div>`).join('')}</div>`
        : '<p class="hint">Chưa có. Khi thêm món mới, chọn “Lưu vào Món của tôi”.</p>';
    };
    draw();
    box.addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (!b) return; foods.splice(+b.dataset.rm, 1); draw(); });
    const skinBox = $('#st-skin', sh);
    skinBox.addEventListener('click', e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      skin = b.dataset.s;
      skinBox.querySelectorAll('[data-s]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      if (skin === 'light') document.documentElement.dataset.skin = 'light'; else delete document.documentElement.dataset.skin;
    });
    const bud = $('#st-budget', sh);
    moneyInput(bud);
    const kc = $('#st-kcal', sh);
    kc.addEventListener('input', () => { const v = digits(kc.value); kc.value = v ? String(v) : ''; });
    $('#st-cats', sh).addEventListener('click', () => { applySkin(); openCats(); });
    $('#st-export', sh).addEventListener('click', () => exportBackup());
    $('#st-file', sh).addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) readBackup(f); });
    $('#st-save', sh).addEventListener('click', () => {
      const b = digits(bud.value), k = digits(kc.value);
      if (!b) { showErr(sh, 'Ngân sách mỗi ngày cần lớn hơn 0.'); bud.focus(); return; }
      if (k < 500 || k > 10000) { showErr(sh, 'Mục tiêu calo nên trong khoảng 500 đến 10.000 kcal.'); kc.focus(); return; }
      const ok = mutateSettings(s => { s.budget = b; s.kcalGoal = k; s.foods = foods; s.skin = skin; });
      if (ok) { closeSheet(); toast('Đã lưu cài đặt'); }
    });
  });
  const wrap = $('#sheet-wrap');
  const wrapObserver = new MutationObserver(() => { if (wrap.hidden) { applySkin(); wrapObserver.disconnect(); } });
  wrapObserver.observe(wrap, {attributes: true, attributeFilter: ['hidden']});
}

/* ---------- backup file (same format in both versions) ---------- */
function buildBackup() {
  const docs = {settings: clone(S.settings), body: {type: 'body', entries: clone(S.body.entries)}};
  const all = allDays();
  Object.keys(all).sort().forEach(k => {
    const d = all[k];
    if (d.expenses.length || d.incomes.length || d.meals.length || d.tasks.length || d.times.length || Object.keys(d.routineDone).length || d.gym) docs['d-' + k] = clone(d);
  });
  return {app: 'nhip-ngay', version: 1, exportedAt: new Date().toISOString(), docs};
}
const backupName = () => `nhip-ngay-sao-luu-${S.today}.json`;

const APP_VERSION = '1.0';
/* ---------- install tip, backup and restore (standalone) ---------- */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isInstalled = () => window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
function lsRead(k) { try { return localStorage.getItem('nhipngay:' + k); } catch (e) { return null; } }
function lsWrite(k, v) { try { localStorage.setItem('nhipngay:' + k, v); } catch (e) {} }
function showInstallTip() { return isIOS && !isInstalled() && lsRead('installTip') !== '0'; }
function lastBackup() { return +lsRead('lastBackup') || 0; }
function needBackup() {
  if (!S.allLoaded) return false;
  const n = Object.keys(S.days).length;
  if (n < 5) return false;
  return Date.now() - lastBackup() > 14 * 86400000;
}
async function exportBackup() {
  if (!S.allLoaded || !S.bodyLoaded || !S.settingsLoaded) { toast(LOADING); return; }
  const name = backupName();
  const blob = new Blob([JSON.stringify(buildBackup())], {type: 'application/json'});
  const mobile = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  let done = false;
  if (mobile && navigator.canShare) {
    try {
      const file = new File([blob], name, {type: 'application/json'});
      if (navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: 'Sao lưu Nhịp Ngày'}); done = true; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (!done) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  lsWrite('lastBackup', String(Date.now()));
  closeSheet();
  toast('Đã tạo file sao lưu. Hãy cất file ở nơi an toàn.');
  render();
}
const DOC_KEY = /^(settings|body|d-\d{4}-\d{2}-\d{2})$/;
function readBackup(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let data = null;
    try { data = JSON.parse(fr.result); } catch (e) {}
    if (!data || data.app !== 'nhip-ngay' || !data.docs || typeof data.docs !== 'object') { toast('File này không phải file sao lưu của Nhịp Ngày.'); return; }
    const keys = Object.keys(data.docs).filter(k => DOC_KEY.test(k) && data.docs[k] && typeof data.docs[k] === 'object');
    const days = keys.filter(k => k.indexOf('d-') === 0).sort();
    const when = data.exportedAt ? new Date(data.exportedAt) : null;
    openSheet(`
      <div class="sh-head"><h3>Khôi phục dữ liệu</h3>${closeBtn}</div>
      <div class="info"><b>${esc(file.name)}</b><p>${when && !isNaN(when) ? 'Sao lưu lúc ' + when.toLocaleString('vi-VN') + '. ' : ''}Có ${days.length} ngày dữ liệu${days.length ? ` (từ ${fmtDayMonth(days[0].slice(2))} đến ${fmtDayMonth(days[days.length - 1].slice(2))})` : ''}.</p></div>
      <p class="hint">Khôi phục sẽ thay toàn bộ dữ liệu đang có trên máy này bằng dữ liệu trong file.</p>
      <div class="sh-actions two"><button class="btn ghost" type="button" data-close>Hủy</button><button class="btn primary" data-k="money" type="button" id="rs-go">Khôi phục</button></div>`,
    sh => {
      $('#rs-go', sh).addEventListener('click', () => {
        try {
          const old = [];
          for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && /^nhipngay:(settings|body|d-)/.test(k)) old.push(k); }
          old.forEach(k => localStorage.removeItem(k));
          keys.forEach(k => {
            let v = data.docs[k];
            if (k === 'settings') v = normSettings(v);
            else if (k === 'body') v = {type: 'body', entries: Array.isArray(v.entries) ? v.entries.filter(x => x && x.date) : []};
            else v = normDay(v, k.slice(2));
            localStorage.setItem('nhipngay:' + k, JSON.stringify(v));
          });
          lsWrite('lastBackup', String(Date.now()));
        } catch (e) { toast('Máy không còn chỗ trống để lưu dữ liệu.'); return; }
        location.reload();
      });
    });
  };
  fr.onerror = () => toast('Không đọc được file này.');
  fr.readAsText(file);
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

/* ---------- running timer ---------- */
function updateRun() {
  const tm = S.settings.timer, el = $('#run');
  if (!tm) { el.hidden = true; document.body.classList.remove('running'); return; }
  const c = catOf('time', tm.cat);
  $('#run-l').textContent = tm.note || c.label;
  $('#run-dot').style.background = `var(--h-${c.h})`;
  el.hidden = false;
  document.body.classList.add('running');
  tickRun();
}
function tickRun() {
  const tm = S.settings.timer; if (!tm) return;
  const txt = clockOf(Date.now() - tm.start);
  $('#run-t').textContent = txt;
  document.querySelectorAll('.run-live').forEach(x => { x.textContent = txt; });
}
setInterval(tickRun, 1000);

/* ---------- navigation & events ---------- */
function setTab(t) {
  if (!VIEWS[t]) return;
  S.tab = t;
  try { localStorage.setItem('nhipngay:tab', t); } catch (e) {}
  render();
  window.scrollTo(0, 0);
}
function setPlanSeg(s) {
  S.planSeg = s === 'time' ? 'time' : 'life';
  try { localStorage.setItem('nhipngay:planseg', S.planSeg); } catch (e) {}
}
function goDay(k) {
  if (!k || !/^\d{4}-\d{2}-\d{2}$/.test(k) || k === S.sel) return;
  S.sel = k;
  S.calMonth = k.slice(0, 7);
  if (Store.ready) subscribeDay();
  render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.closest('#sheet')) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch (a) {
    case 'goto': setTab(b.dataset.tab); break;
    case 'goto-life': setPlanSeg('life'); setTab('plan'); break;
    case 'time-open': setPlanSeg('time'); setTab('plan'); break;
    case 'plan-seg': setPlanSeg(b.dataset.s); render(); break;
    case 'prev': goDay(addDays(S.sel, -1)); break;
    case 'next': goDay(addDays(S.sel, 1)); break;
    case 'today': goDay(S.today); break;
    case 'settings': openSettings(); break;
    case 'quick': openQuick(); break;
    case 'add-tx': openTx(b.dataset.kind); break;
    case 'edit-tx': openTx(b.dataset.kind, id); break;
    case 'balance': openBalance(); break;
    case 'eye': S.hide = !S.hide; try { localStorage.setItem('nhipngay:hide', S.hide ? '1' : '0'); } catch (err) {} render(); break;
    case 'per': S.per = b.dataset.p === 'month' ? 'month' : 'week'; try { localStorage.setItem('nhipngay:per', S.per); } catch (err) {} render(); break;
    case 'per-step': perStep(+b.dataset.step); render(); break;
    case 'flow': S.flow = b.dataset.mode === 'thu' ? 'thu' : 'chi'; render(); break;
    case 'pick-day': goDay(b.dataset.key); break;
    case 'cal-month': S.calMonth = addMonths(S.calMonth, +b.dataset.step); render(); break;
    case 'cal-mode': S.calMode = b.dataset.mode; try { localStorage.setItem('nhipngay:cal', S.calMode); } catch (err) {} render(); break;
    case 'time-add': openTime(); break;
    case 'edit-time': openTime(id); break;
    case 'timer-start': openTimerStart(); break;
    case 'timer-stop': stopTimer(); break;
    case 'goal-add': openGoal(null); break;
    case 'edit-goal': openGoal(+b.dataset.i); break;
    case 'cats': openCats(); break;
    case 'add-food': openFood(null, b.dataset.meal); break;
    case 'edit-meal': openFood(id); break;
    case 'add-task': openTask(); break;
    case 'edit-task': openTask(id); break;
    case 'add-routine': openRoutine(); break;
    case 'edit-routine': openRoutine(id); break;
    case 'toggle': toggle(b.dataset.kind, id); break;
    case 'add-body': openBody(); break;
    case 'edit-body': openBody(b.dataset.date); break;
    case 'hide-install': lsWrite('installTip', '0'); render(); break;
    case 'backup': exportBackup(); break;
  }
});
$('#sheet-wrap').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
document.addEventListener('focusout', () => {
  if (!S.deferred) return;
  setTimeout(() => { if (S.deferred && !viewHasFocus()) render(); }, 320);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet-wrap').hidden) closeSheet(); });
$('#pick').addEventListener('change', e => goDay(e.target.value));
$('#pick').addEventListener('click', e => { try { if (e.target.showPicker) e.target.showPicker(); } catch (err) {} });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = keyOf(new Date());
  if (t === S.today) { if ($('#sheet-wrap').hidden) render(); return; }
  const wasToday = S.sel === S.today, wasCurPer = perRange(S.per, S.anchor).from === perRange(S.per, S.today).from;
  S.today = t;
  if (wasCurPer) S.anchor = t;
  if (wasToday) { S.sel = t; S.calMonth = t.slice(0, 7); if (Store.ready) subscribeDay(); }
  render();
});
setInterval(() => { if ($('#sheet-wrap').hidden && (S.tab === 'plan' || S.tab === 'today') && S.sel === S.today) render(); }, 60000);

/* ---------- start ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
render();
Store.init().then(() => {
  subscribeSettings();
  subscribeDay();
  subscribeAll();
  subscribeBody();
  render();
});
})();
</script>
</body>
</html>
